services:
  worker:
    build:
      context: .
      dockerfile: workers/image-worker/Dockerfile
    environment:
      IMAGE_WORKER_PORT: 3020
      IMAGE_WORKER_TOKEN: ${IMAGE_WORKER_TOKEN:-local-dev-worker-token-change-me}
      IMAGE_WORKER_MAX_REQUEST_BYTES: ${IMAGE_WORKER_MAX_REQUEST_BYTES:-104857600}
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      API_KEY: ${API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      IMAGE_WORKER_URL: http://worker:3020
      IMAGE_WORKER_TOKEN: ${IMAGE_WORKER_TOKEN:-local-dev-worker-token-change-me}
      IMAGE_WORKER_DEADLINE_MS: ${IMAGE_WORKER_DEADLINE_MS:-30000}
    depends_on:
      worker:
        condition: service_healthy
    ports:
      - "${API_PORT:-3001}:3001"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped
