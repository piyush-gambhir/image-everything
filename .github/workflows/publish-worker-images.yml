name: Publish API and image worker containers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["workers-v*"]
    paths:
      - "backend/**"
      - "workers/**"
      - "packages/image-contracts/**"
      - "package.json"
      - ".npmrc"
      - ".dockerignore"
      - "scripts/check-boundaries.mjs"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "LICENSE"
      - "docker-compose.published.yml"
      - ".github/workflows/workers-ci.yml"
      - ".github/workflows/publish-worker-images.yml"

permissions:
  contents: read

concurrency:
  group: image-runtime-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/workers-ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        include:
          - image: image-everything-api
            dockerfile: backend/Dockerfile
          - image: image-everything-image-worker
            dockerfile: workers/image-worker/Dockerfile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.2.0
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=Image Everything self-hosted image processing API and isolated Sharp/libvips worker
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' && github.ref_name != 'main' }}
            type=match,pattern=workers-v(.*),group=1
      - name: Build and publish
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Attest image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
