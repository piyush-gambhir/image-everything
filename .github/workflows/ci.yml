name: CI

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    runs-on: ubuntu-24.04-arm
    name: Lint and Format Check
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC token for the Turborepo Remote Cache

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Turborepo Remote Cache
        # Fork and Dependabot PRs cannot request an OIDC token; they run with the local cache only.
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: piyushgambhir-personal

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Turborepo cache
        uses: actions/cache@v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify execution boundaries
        run: pnpm check:boundaries

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  test:
    runs-on: ubuntu-24.04-arm
    name: Tests
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC token for the Turborepo Remote Cache

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Turborepo Remote Cache
        # Fork and Dependabot PRs cannot request an OIDC token; they run with the local cache only.
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: piyushgambhir-personal

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Turborepo cache
        uses: actions/cache@v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        env:
          SKIP_ENV_VALIDATION: true

  build:
    runs-on: ubuntu-24.04-arm
    name: Build
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC token for the Turborepo Remote Cache

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Turborepo Remote Cache
        # Fork and Dependabot PRs cannot request an OIDC token; they run with the local cache only.
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: piyushgambhir-personal

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Turborepo cache
        uses: actions/cache@v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Validate Docker Compose topology
        run: docker compose config --quiet

      - name: Build all production containers
        run: docker compose build

  type-check:
    runs-on: ubuntu-24.04-arm
    name: TypeScript Type Check
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC token for the Turborepo Remote Cache

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Turborepo Remote Cache
        # Fork and Dependabot PRs cannot request an OIDC token; they run with the local cache only.
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: piyushgambhir-personal

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Turborepo cache
        uses: actions/cache@v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: pnpm typecheck

      - name: Verify compiler API compatibility
        run: pnpm -r --if-present typecheck:compat

  smoke:
    runs-on: ubuntu-24.04
    name: Full-stack v2 Smoke Matrix
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC token for the Turborepo Remote Cache

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Turborepo Remote Cache
        # Fork and Dependabot PRs cannot request an OIDC token; they run with the local cache only.
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: piyushgambhir-personal

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Turborepo cache
        uses: actions/cache@v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production services
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Exercise all v2 APIs and UI tools
        run: pnpm smoke
