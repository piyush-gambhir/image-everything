version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - "/"
      - "/backend"
      - "/web"
      - "/workers/image-worker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directories:
      - "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # typescript-eslint and the Nest CLI need the TS JS API, which TS 7.0 does not ship.

      - dependency-name: typescript
        versions: ["7.x"]
